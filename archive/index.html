<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="每日资源导航历史归档：按年份、月份、日期浏览过往精选内容">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-overlay"></div>
    <div class="bg-particles" id="bgParticles"></div>
  </div>

  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          <span class="logo-text">每日资源导航</span>
        </div>
        <nav class="header-nav">
          <a href="../" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
          </a>
        </nav>
        <div class="header-meta">
          <span class="date" id="currentDate"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="archive-hero">
        <h1 class="archive-title">历史归档</h1>
        <p class="archive-subtitle">按时间浏览过往每日精选内容</p>
      </section>

      <section class="archive-tree" aria-labelledby="archiveTreeTitle">
        <div id="archiveTree"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>每日更新 · 数据来源：<a href="https://github.com/yww006/site" target="_blank">GitHub</a> · 部署：GitHub Pages</p>
    </div>

  <script src="../assets/script.js"></script>
  <script src="../assets/archive.js"></script>
